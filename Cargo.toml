[package]
name = "z-com"
version = "0.3.0"
description = "Z_COM cross-platform communication terminal"
authors = ["Zack(zzk)"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ZIKEER/Z_COM"

[lib]
# 库名与二进制名区分，避免 Windows 上产物文件名冲突（rust-lang/cargo#8519）
name = "z_com_lib"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
parking_lot = "0.12"
probe-rs = "=0.31.0"
serialport = "4"
thiserror = "2"
fs2 = "0.4"
libloading = "0.8"
if-addrs = "0.13"
dunce = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
semver = "1"
sha2 = "0.10"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "0.32.1"
rfd = "0.15"
crossbeam-channel = "0.5"
fontdb = "0.23"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
