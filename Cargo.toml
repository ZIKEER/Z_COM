[package]
name = "z_com"
version = "0.3.0"
edition = "2021"
description = "Z_COM - Multi-protocol serial communication debugging tool"
authors = ["Zack(zzk)"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
serialport = "4"
probe-rs = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
directories = "5"
fs2 = "0.4"
parking_lot = "0.12"
hex = "0.4"
tempfile = "3"

[build-dependencies]
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
