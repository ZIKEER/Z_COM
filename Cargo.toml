[package]
name = "z_com"
version = "0.2.1"
edition = "2021"
description = "Z_COM - Multi-protocol serial communication debugging tool"
authors = ["Zack(zzk)"]

[dependencies]
slint = "1"
serialport = "4"
probe-rs = { version = "0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
directories = "5"
fs2 = "0.4"
parking_lot = "0.12"
hex = "0.4"
tempfile = "3"

[build-dependencies]
slint-build = "1"
chrono = "0.4"

[features]
default = []
rtt = ["probe-rs"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
